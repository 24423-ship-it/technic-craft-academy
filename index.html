const draw=()=>{const q=$('#flt').value,r=$('#rows');r.innerHTML='';data.filter(d=>!q||(d.student_name||'').includes(q)).forEach(d=>{const b=document.createElement('button');b.style.cssText='display:block;margin:2px 0;font:inherit';b.textContent=`${names[LK[d.form_type]]} | ${d.student_name||'(ไม่มีชื่อ)'} | ${new Date(d.created_at).toLocaleString('th-TH')}`;b.onclick=()=>openRec(d.id);r.appendChild(b)})};
$('#flt').oninput=draw;draw()}
async function openRec(id){const{data,error}=await sb.from('form_records').select('*').eq('id',id).single();if(error)return msg('เปิดไม่สำเร็จ: '+error.message);
const k=LK[data.form_type];show(k);const f=fields($('#p'+k));
data.data.vals.forEach((v,i)=>{const e=f[i];if(!e)return;if(e.type=='checkbox'||e.type=='radio')e.checked=v;else e.value=v});
IM=data.data.im||[];drawIm();pct();
document.querySelectorAll('.sd').forEach(tb=>{const r=tb.querySelector('input:checked');if(r)r.dispatchEvent(new Event('change',{bubbles:true}))});
cur={k,id};$('#lst').innerHTML='';msg('เปิดข้อมูลแล้ว')}
auth();
</script></body></html>
